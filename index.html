<!DOCTYPE html>
<html lang="en">

<head>

    <link
        rel="icon"
        type="image/png"
        href="images/ico.png"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fajar Putra Waluya</title>

    <!-- ==========================
         FONT
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- ==========================

    ========================== -->

    <link

</head>

<body>

    <!-- ==========================
         TERMINAL
    ========================== -->

    <main class="terminal">

        <!-- ==========================
             TERMINAL BAR
        ========================== -->

        <div class="terminal-bar">

            <div class="terminal-dots">

                <span></span>
                <span></span>
                <span></span>

            </div>

            <p>
                wly@home:~
            </p>

            <div></div>

        </div>

        <!-- ==========================
             CONTENT
        ========================== -->

        <div class="terminal-content">

      <!-- ==============================
     WHOAMI
============================== -->

<section class="terminal-section">

    <p class="command">

        <span>wly@home:~$</span>

        whoami

    </p>

    <div class="identity">

        <h1>

            <span class="arrow">&gt;</span>

            Fajar Putra Waluya

        </h1>

        <p class="meta">

            <span class="arrow">&gt;</span>

            <span id="age"></span> y.o

            <span class="dot">•</span>

            ♌ Leo

            <span class="dot">•</span>

            Indonesia

        </p>

    </div>

</section>


<!-- ==============================
     ABOUT
============================== -->

<section class="terminal-section">

    <p class="command">

        <span>wly@home:~$</span>

        about

    </p>

    <p class="about-text">

        Just a little space on the internet that I call mine.
        A place for my thoughts, ideas, and everything in between.

    </p>

</section>


<!-- ==============================
     THINGS I'VE BUILT
============================== -->

<section class="terminal-section">

    <button
        class="command command-toggle"
        id="projectToggle"
    >

        <span>▸</span>

        things i've built

    </button>

    <div
        class="projects-collapse"
        id="projectsCollapse"
    >

        <!-- Projects -->

    </div>

</section>


<!-- ==============================
     SPOTIFY
============================== -->

<section class="terminal-section">

    <button
        class="command command-toggle"
        id="spotifyToggle"
    >

        <span>▸</span>

        spotify

    </button>

    <div
        class="projects-collapse"
        id="spotifyCollapse"
    >

        <div class="spotify-wrapper">

            <iframe
                src="https://open.spotify.com/embed/playlist/37i9dQZF1DZ06evO1IPOOk?utm_source=generator&theme=0"
                width="100%"
                height="352"
                loading="lazy"
            ></iframe>

        </div>

    </div>

</section>


<!-- ==============================
     WATCH LOG
============================== -->

<section class="terminal-section">

    <button
        class="command command-toggle"
        id="watchToggle"
    >

        <span>▸</span>

        watch log

    </button>

    <div
        class="projects-collapse"
        id="watchCollapse"
    >

        <div id="watchlist-container"></div>

    </div>

</section>

            <!-- ==========================
                 FOOTER
            ========================== -->

            <footer>

                <p>
                    // end of file
                </p>

            </footer>

        </div>
        <!-- END TERMINAL CONTENT -->

    </main>

    <script src="js/main.js"></script>
