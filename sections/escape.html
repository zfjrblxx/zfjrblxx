<!-- ==============================
     ESCAPE GAME
============================== -->

<section class="terminal-section escape-trigger">

    <p class="command">
        <span>wly@home:~$</span> escape
    </p>

    <button class="terminal-btn" id="startEscape">
        [ MASUK ]
    </button>

</section>


<div class="escape-screen" id="escapeScreen">

    <div class="escape-window">

        <!-- HEADER -->

        <div class="escape-header">

            <span>ESCAPE_PROTOCOL.exe</span>

            <button id="closeEscape">
                [x]
            </button>

        </div>


        <!-- CONTENT -->

        <div class="escape-content">


            <!-- =====================
                 PUZZLE 01
            ====================== -->

            <div id="puzzle1">

                <p class="escape-error">
                    &gt; AKSES DIBATASI
                </p>

                <p>
                    Seharusnya kamu tidak berada di sini.
                </p>

                <p>
                    Temukan kode akses untuk melanjutkan.
                </p>


                <div class="escape-hint">

                    <span>PETUNJUK:</span>

                    kamu pernah melihat tempat kode itu disembunyikan.

                </div>


                <div class="code-area">

                    <label for="accessCode">
                        kode_akses:
                    </label>

                    <div class="code-input">

                        <span>&gt;</span>

                        <input
                            type="text"
                            id="accessCode"
                            autocomplete="off"
                            spellcheck="false"
                            placeholder="_"
                        >

                    </div>

                </div>


                <button
                    class="terminal-btn"
                    id="submitCode"
                >
                    [ JALANKAN ]
                </button>


                <p
                    class="escape-status"
                    id="escapeStatus"
                ></p>

            </div>


            <!-- =====================
                 PUZZLE 02
            ====================== -->

            <div
                id="puzzle2"
                class="puzzle-hidden"
            >

                <p class="directory-line">
                    &gt; AKSES DITERIMA
                </p>

                <p class="directory-line">
                    &gt; membuka /unknown/...
                </p>


                <br>


                <p class="directory-command">
                    wly@unknown:~$ ls
                </p>


                <!-- FILES -->

                <div class="file-list">


                    <button
                        class="file-item"
                        data-file="system"
                    >

                        <span>[01]</span>

                        system.log

                    </button>


                    <button
                        class="file-item"
                        data-file="memory"
                    >

                        <span>[02]</span>

                        memory.dat

                    </button>


                    <button
                        class="file-item"
                        data-file="exit"
                    >

                        <span>[03]</span>

                        exit.key

                    </button>


                    <button
                        class="file-item"
                        data-file="readme"
                    >

                        <span>[04]</span>

                        README.txt

                    </button>


                </div>


                <!-- OUTPUT -->

                <div
                    class="file-output"
                    id="fileOutput"
                >

                    &gt; pilih sebuah file

                </div>

            </div>

        </div>


        <!-- FOOTER -->

        <div class="escape-footer">

            <span id="puzzleCounter">
                PUZZLE 01 / 05
            </span>

        </div>

    </div>

</div>
