<!-- ==============================
     ESCAPE GAME
============================== -->

<section class="terminal-section escape-trigger">

    <p class="command">
        <span>wly@home:~$</span> escape
    </p>

    <button class="terminal-btn" id="startEscape">
        [ ENTER ]
    </button>

</section>


<div class="escape-screen" id="escapeScreen">

    <div class="escape-window">

        <div class="escape-header">

            <span>ESCAPE_PROTOCOL.exe</span>

            <button id="closeEscape">
                [x]
            </button>

        </div>


        <div class="escape-content">

            <!-- =====================
                 PUZZLE 01
            ====================== -->

            <div id="puzzle1">

                <p class="escape-error">
                    &gt; ACCESS RESTRICTED
                </p>

                <p>
                    You shouldn't be here.
                </p>

                <p>
                    Find the access code to continue.
                </p>


                <div class="escape-hint">

                    <span>HINT:</span>

                    you've already seen where it's hidden.

                </div>


                <div class="code-area">

                    <label for="accessCode">
                        access_code:
                    </label>

                    <div class="code-input">

                        <span>&gt;</span>

                        <input
                            type="text"
                            id="accessCode"
                            autocomplete="off"
                            spellcheck="false"
                            placeholder="_"
                        >

                    </div>

                </div>


                <button class="terminal-btn" id="submitCode">
                    [ EXECUTE ]
                </button>


                <p
                    class="escape-status"
                    id="escapeStatus">
                </p>

            </div>


            <!-- =====================
                 PUZZLE 02
            ====================== -->

            <div id="puzzle2" class="puzzle-hidden">

                <p class="directory-line">
                    &gt; ACCESS ACCEPTED
                </p>

                <p class="directory-line">
                    &gt; mounting /unknown/...
                </p>

                <br>

                <p class="directory-command">
                    wly@unknown:~$ ls
                </p>


                <div class="file-list">

                    <button
                        class="file-item"
                        data-file="system">

                        <span>[01]</span>
                        system.log

                    </button>


                    <button
                        class="file-item"
                        data-file="memory">

                        <span>[02]</span>
                        memory.dat

                    </button>


                    <button
                        class="file-item"
                        data-file="exit">

                        <span>[03]</span>
                        exit.key

                    </button>


                    <button
                        class="file-item"
                        data-file="readme">

                        <span>[04]</span>
                        README.txt

                    </button>

                </div>


                <div
                    class="file-output"
                    id="fileOutput">

                    &gt; choose a file

                </div>

            </div>

        </div>


        <div class="escape-footer">

            <span id="puzzleCounter">
                PUZZLE 01 / 05
            </span>

        </div>

    </div>

</div>
