<!-- =========================================
WATCHLIST BUTTON
========================================= -->

<div class="watch-home">

    <button
        id="watchlistFolder"
        class="pixel-folder"
        aria-label="Open Watch Log">

        <span class="folder-icon">

            📼

        </span>

        <span class="folder-text">

            Open Watch Log

        </span>

    </button>

</div>



<!-- =========================================
WATCHLIST OVERLAY
========================================= -->

<div
    id="watchlistOverlay"
    class="watchlist-overlay">

    <div class="watch-window">

        <!-- HEADER -->

        <div class="watch-header">

            <div class="watch-title">

                WATCH LOG

                (<span id="watchCount">0</span>)

            </div>

            <button
                id="closeWatchlist"
                class="watch-close">

                ✕

            </button>

        </div>



        <!-- SEARCH -->

        <div class="watch-search">

            <input

                id="watchSearch"

                type="text"

                placeholder="Search movie or series..."

                autocomplete="off">

        </div>



        <!-- A-Z -->

        <div
            id="watchLetters"
            class="watch-letters">

        </div>



        <!-- CONTENT -->

        <div
            id="watchlistContent"
            class="watch-content">

            <div class="watch-loading">

                Loading...

            </div>

        </div>



        <!-- FOOTER -->

        <div class="watch-footer">

            <span>

                Pixel Library

            </span>

            <span id="watchlistCount">

                0 Items

            </span>

        </div>

    </div>

</div>
