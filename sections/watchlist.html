<!-- ==============================
     WATCHLIST
============================== -->

<section class="terminal-section watchlist-section">

    <p class="command">
        <span>wly@home:~$</span> Watchlist
    </p>

    <button
        class="watchlist-folder"
        id="watchlistFolder"
    >
        <span class="watchlist-folder-icon">📁</span>
        <span>watchlist</span>
    </button>

</section>


<!-- ============================
     WATCHLIST OVERLAY
============================ -->

<div
    class="watchlist-overlay"
    id="watchlistOverlay"
>

    <div class="watchlist-window">

        <!-- HEADER -->

        <div class="watchlist-header">

            <span>~/watchlist</span>

            <button id="closeWatchlist">
                [x]
            </button>

        </div>


        <!-- CONTENT -->

        <div
            class="watchlist-content"
            id="watchlistContent"
        >
            <p class="watchlist-loading">
                &gt; loading...
            </p>
        </div>


        <!-- FOOTER -->

        <div class="watchlist-footer">

            <span>~/watchlist</span>

            <span id="watchlistCount">
                0 items
            </span>

        </div>

    </div>

</div>
