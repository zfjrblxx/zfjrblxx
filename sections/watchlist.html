<!-- ============================
     WATCHLIST
============================ -->

<section class="terminal-section watchlist-section">

    <p class="command">
        <span>wly@home:~$</span> watch log
    </p>

    <button
    class="secret-folder"
    id="watchlistFolder"
    aria-label="Open watchlist"
>
    <svg class="watchlist-folder-icon" viewBox="0 0 24 24">
    <path fill="currentColor"
        d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/>
</svg>
</button>

</section>


<!-- ============================
     WATCHLIST OVERLAY
============================ -->

<div
    class="watchlist-overlay"
    id="watchlistOverlay"
>

    <div class="watchlist-window">

        <!-- HEADER -->

        <div class="watchlist-header">

          <span>~/watch log [<span id="watchCount">0</span>]</span>

            <button id="closeWatchlist">
                [x]
            </button>

        </div>


        <!-- CONTENT -->

        <div
            class="watchlist-content"
            id="watchlistContent"
        >
            <p class="watchlist-loading">
                &gt; loading...
            </p>
        </div>


        <!-- FOOTER -->

        <div class="watchlist-footer">

            <span>~/watch log</span>

            <span id="watchlistCount">
                0 items
            </span>

        </div>

    </div>

</div>
